# ==============================================================================
#  EROCORE WEB STUDIO — JEKYLL / GITHUB PAGES YAPILANDIRMASI
#  Sürüm     : 2.0.0
#  Uyumluluk : github-pages v232 (jekyll 3.10.x)
#  Not       : Tema yok — saf statik HTML + CSS + JS mimarisi.
# ==============================================================================

# ------------------------------------------------------------------------------
#  01 · SİTE KİMLİĞİ
# ------------------------------------------------------------------------------
title: "EroCore Web Studio"
tagline: "Geleceğin Web Deneyimi — 3D İnteraktif Tasarım & Geliştirme"
description: >-
  EroCore Web Studio, işletmelere modern, mobil uyumlu ve 3D interaktif web
  siteleri tasarlayan butik bir web stüdyosudur. Ücretsiz demo, şeffaf
  fiyatlandırma, 2 revizyon hakkı ve profesyonel teslim.

url: "https://erocores.github.io"
baseurl: ""

lang: tr-TR
timezone: Europe/Istanbul

# ------------------------------------------------------------------------------
#  02 · YAZAR VE İLETİŞİM
# ------------------------------------------------------------------------------
author:
  name: "Mehmet — EroCore Web Studio"
  email: "mehmeteroglu911@outlook.com.tr"
  url: "https://erocores.github.io"

email: "mehmeteroglu911@outlook.com.tr"
github_username: EroCores

# ------------------------------------------------------------------------------
#  03 · SOSYAL MEDYA / SEO GÖRSELLERİ
# ------------------------------------------------------------------------------
logo: /assets/images/erocore-og.png
image: /assets/images/erocore-og.png

twitter:
  username: EroCores
  card: summary_large_image
  creator: "@EroCores"

social:
  name: EroCore Web Studio
  links:
    - https://github.com/EroCores
    - mailto:mehmeteroglu911@outlook.com.tr

# ------------------------------------------------------------------------------
#  04 · MARKDOWN VE SYNTAX HIGHLIGHTING
# ------------------------------------------------------------------------------
markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  auto_ids: true
  syntax_highlighter: rouge
  hard_wrap: false

# ------------------------------------------------------------------------------
#  05 · DOSYA DAHİL ETME / HARİÇ TUTMA
# ------------------------------------------------------------------------------
include:
  - .htaccess
  - _redirects

exclude:
  - .github/
  - .vscode/
  - .idea/
  - node_modules/
  - vendor/
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - README.md
  - "*.log"
  - "*.tmp"

# ------------------------------------------------------------------------------
#  06 · EKLENTİLER (GitHub Pages Whitelist Uyumlu)
# ------------------------------------------------------------------------------
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-titles-from-headings

# ------------------------------------------------------------------------------
#  07 · VARSAYILAN DEĞERLER (jekyll-seo-tag için OG görseli)
# ------------------------------------------------------------------------------
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/erocore-og.png
      sitemap: true

# ------------------------------------------------------------------------------
#  08 · RSS / FEED
# ------------------------------------------------------------------------------
feed:
  path: feed.xml
  posts_limit: 20

# ------------------------------------------------------------------------------
#  09 · URL YAPISI
# ------------------------------------------------------------------------------
permalink: pretty

# ------------------------------------------------------------------------------
#  10 · COLLECTIONS (Blog + Vaka Çalışmaları)
# ------------------------------------------------------------------------------
collections:
  projects:
    output: true
    permalink: /projeler/:slug/
  posts:
    output: true
    permalink: /blog/:year/:month/:day/:title/

# ------------------------------------------------------------------------------
#  SEO — Open Graph & Twitter Card
# ------------------------------------------------------------------------------
lang: tr-TR
logo: /assets/images/erocore-og.png
image: /assets/images/erocore-og.png

twitter:
  username: EroCores
  card: summary_large_image
  creator: "@EroCores"

social:
  name: EroCore Web Studio
  links:
    - https://github.com/EroCores

# SEO Tag'ın her sayfaya uygulaması için varsayılanlar
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/erocore-og.png

# ==============================================================================
#  YAPILANDIRMA SONU
# ==============================================================================
